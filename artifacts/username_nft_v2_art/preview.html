<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Platho Username NFT v2 Art Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #050807;
      color: #f4fff9;
    }
    body {
      margin: 0;
      padding: 32px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
      max-width: 1180px;
    }
    figure {
      margin: 0;
    }
    img {
      display: block;
      width: 100%;
      border-radius: 8px;
      background: #071614;
    }
    figcaption {
      margin-top: 10px;
      color: #a6c7bd;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Platho Username NFT v2 Art Preview</h1>
  <div class="grid">
    <figure>
      <img src="./platho-username-4-premium.svg" alt="4 character premium username NFT">
      <figcaption>4 symbols: prime premium</figcaption>
    </figure>
    <figure>
      <img src="./platho-username-5-near-premium.svg" alt="5 character rare username NFT">
      <figcaption>5 symbols: rare near-premium</figcaption>
    </figure>
    <figure>
      <img src="./platho-username-6-standard.svg" alt="6 plus character standard username NFT">
      <figcaption>6+ symbols: standard</figcaption>
    </figure>
  </div>
</body>
</html>
