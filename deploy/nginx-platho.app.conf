map $uri $platho_cache_control {
    default "public, max-age=3600";
    ~^/sw\.js$ "no-cache, no-store, must-revalidate";
    ~^/(|index\.html|manifest\.webmanifest)$ "no-cache";
    ~^/(assets|vendor)/ "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name platho.app www.platho.app;
    return 301 https://platho.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.platho.app;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    return 301 https://platho.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc.platho.app;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    access_log off;
    error_log /var/log/nginx/rpc.platho.app.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platho.app;

    root /srv/platho/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    access_log off;
    error_log /var/log/nginx/platho.app.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-SLdbJxH1ETsf/Yx+7SyKot6BP+1toqgkV32YAmD36K0=' 'sha256-RaSAaXmdhJXw3EBibZEVWPjFAFKOuUWWQUpb+UMMJDw='; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://toncenter.com https://*.toncenter.com https://rpc.platho.app; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $platho_cache_control always;

    location = /sw.js {
        try_files $uri =404;
    }

    location ~ ^/(index\.html|manifest\.webmanifest)$ {
        try_files $uri =404;
    }

    location ~ ^/(assets|vendor)/ {
        try_files $uri =404;
    }

    location ~ \.(html|webmanifest|css|js|mjs|json|md|wasm|svg|png)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
