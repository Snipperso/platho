# NOT IN USE — platho.app is served by CADDY (see deploy/Caddyfile), and nginx is not even running on the
# host. This file was three months stale on 2026-08-13 and cost hours: it was read as if it described production,
# and two test guards asserted against it. Kept only as a reference for a possible future migration. If you touch
# it, it still serves nothing. Verify against the live server before believing any config file in this directory.

map $uri $platho_cache_control {
    default "public, max-age=3600";
    ~^/sw\.js$ "no-cache, no-store, must-revalidate";
    ~^/(|index\.html|manifest\.webmanifest)$ "no-cache";
    ~^/(assets|vendor)/ "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name platho.app www.platho.app;
    return 301 https://platho.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.platho.app;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    return 301 https://platho.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platho.app;

    root /srv/platho/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    access_log off;
    error_log /var/log/nginx/platho.app.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://toncenter.com https://*.toncenter.com https://tonapi.io https://mainnet-v4.tonhubapi.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors https://web.telegram.org; form-action 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $platho_cache_control always;

    location = /sw.js {
        try_files $uri =404;
    }

    location ~ ^/(index\.html|manifest\.webmanifest)$ {
        try_files $uri =404;
    }

    location ~ ^/(assets|vendor)/ {
        try_files $uri =404;
    }

    location ~ \.(html|webmanifest|css|js|mjs|json|md|wasm|svg|png)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
