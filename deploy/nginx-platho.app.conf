map $uri $platho_cache_control {
    default "public, max-age=3600";
    ~^/sw\.js$ "no-cache, no-store, must-revalidate";
    ~^/(|index\.html|manifest\.webmanifest)$ "no-cache";
    ~^/(assets|vendor)/ "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name platho.app www.platho.app;
    return 301 https://platho.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.platho.app;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    return 301 https://platho.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platho.app;

    root /var/www/platho.app/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/platho.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platho.app/privkey.pem;

    access_log off;
    error_log /var/log/nginx/platho.app.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $platho_cache_control always;

    location = /sw.js {
        try_files $uri =404;
    }

    location ~ ^/(index\.html|manifest\.webmanifest)$ {
        try_files $uri =404;
    }

    location ~ ^/(app\.js|styles\.css|platho-config\.mjs|platho-wallet\.mjs|pwa-contract-transactions\.mjs|replay-store\.mjs|vault-chain-provider\.mjs|crypto/.*)$ {
        try_files $uri =404;
    }

    location ~ ^/(assets|vendor)/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
